[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agf"
version = "0.1.0"
description = "Aura Graph Format — read, write, validate and evaluate typed mathematical documents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "artistso", email = "290508482+artistso@users.noreply.github.com" }]
keywords = ["mathematics", "hypergraph", "data-format", "computer-algebra", "sympy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
sympy = ["sympy>=1.12"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/artistso/aura-cal"
Specification = "https://github.com/artistso/aura-cal/blob/main/docs/SPEC.md"

[project.scripts]
agf = "agf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
